  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #1B2B4B;
      color: #FAF8F4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 560px; }
    .code {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(80px, 18vw, 140px);
      line-height: 1;
      color: #D4AF5A;
      margin-bottom: 8px;
    }
    .eyebrow {
      font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: #D4AF5A; margin-bottom: 20px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-size: clamp(26px, 5vw, 36px);
      line-height: 1.2; margin-bottom: 18px;
    }
    p {
      font-size: 15px; line-height: 1.8;
      color: rgba(250, 248, 244, 0.6);
      margin-bottom: 36px;
    }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      font-size: 12px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 14px 30px; text-decoration: none;
      transition: background 0.25s ease, color 0.25s ease;
    }
    .btn-primary { background: #8A6E14; color: #1B2B4B; }
    .btn-primary:hover { background: #D4AF5A; }
    .btn-ghost { border: 1px solid rgba(250,248,244,0.25); color: rgba(250,248,244,0.75); }
    .btn-ghost:hover { border-color: #D4AF5A; color: #D4AF5A; }
    .btn:focus-visible { outline: 3px solid #D4AF5A; outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Cabinet CHORFI</p>
    <div class="code">404</div>
    <h1>Cette page est introuvable</h1>
    <p>La page que vous cherchez a peut-être été déplacée ou n'existe plus. Revenez à l'accueil ou contactez-nous directement.</p>
    <div class="actions">
      <a href="/index.html" class="btn btn-primary">Retour à l'accueil</a>
      <a href="/contact.html" class="btn btn-ghost">Nous contacter</a>
    </div>
  </div>
</body>
