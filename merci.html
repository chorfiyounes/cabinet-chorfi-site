<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <title>Candidature envoyée — Cabinet CHORFI</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #1B2B4B;
      color: #FAF8F4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 520px; }
    .check {
      width: 72px; height: 72px;
      border: 2px solid #8A6E14;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 32px;
    }
    .check svg { width: 32px; height: 32px; stroke: #D4AF5A; stroke-width: 2.5; fill: none; }
    .eyebrow {
      font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
      color: #D4AF5A; margin-bottom: 16px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-size: clamp(32px, 6vw, 48px);
      line-height: 1.1; margin-bottom: 20px;
    }
    p {
      font-size: 15px; line-height: 1.8;
      color: rgba(250, 248, 244, 0.6);
      margin-bottom: 36px;
    }
    .btn {
      display: inline-block;
      background: #8A6E14; color: #1B2B4B;
      font-size: 12px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 14px 32px; text-decoration: none;
      transition: background 0.25s ease;
    }
    .btn:hover { background: #D4AF5A; }
    .btn:focus-visible { outline: 3px solid #D4AF5A; outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12" /></svg>
    </div>
    <p class="eyebrow">Cabinet CHORFI</p>
    <h1>Candidature bien reçue</h1>
    <p>Merci pour votre candidature. Nous étudions chaque dossier avec attention et reviendrons vers vous dans les meilleurs délais.</p>
    <a href="index.html" class="btn">Retour à l'accueil</a>
  </div>
</body>
</html>
